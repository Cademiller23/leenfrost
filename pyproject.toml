[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leenfrost"
version = "0.1.0"
description = "Leenfrost — Token fiscal gateway for AI agents. Budgets, density pruning, and spend visibility before the expensive call."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
snowflake = ["snowflake-connector-python>=3.12", "streamlit>=1.37"]

[tool.hatch.build.targets.wheel]
packages = ["src/leenfrost"]
